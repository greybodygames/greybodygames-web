name: CI

on:
  workflow_call:
    inputs:
      publish-artifact:
        description: Upload the generated site for the deployment workflow
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  build-site:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout and install Node dependencies
        uses: SayakMukhopadhyay/github-actions/checkout-dependencies@v1
        with:
          node-version: 24.16.0

      - name: Check formatting
        run: npm run format:check

      - name: Build site
        run: npm run build

      - name: Validate generated site
        uses: SayakMukhopadhyay/github-actions/validate-static-site@v1
        with:
          path: dist

      - name: Upload generated site
        if: inputs.publish-artifact
        uses: actions/upload-artifact@v7
        with:
          name: site-greybody-games
          path: dist
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
